services:
  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db

  db:
    image: postgis/postgis:16-3.4

    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=runes_dev
      - POSTGRES_USER=runes_user
      - POSTGRES_PASSWORD=changeme
    ports:
      - "5432:5432"

volumes:
  postgres_data:
